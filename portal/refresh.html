<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>正在刷新门户</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #171a1f; background: #f7f6f1; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { padding: 32px; text-align: center; }
    strong { display: block; margin-bottom: 8px; font-size: 20px; }
    span { color: #62676f; font-size: 14px; }
  </style>
</head>
<body>
  <main><strong>正在刷新学习门户</strong><span>清理旧版本后将自动打开首页。</span></main>
  <script>
    (async function () {
      try {
        if ("serviceWorker" in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        }
        if ("caches" in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }
      } finally {
        window.location.replace("/?refreshed=" + Date.now());
      }
    }());
  </script>
</body>
</html>
