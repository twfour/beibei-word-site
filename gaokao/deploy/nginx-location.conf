# Insert inside the HTTPS server block for chinese.qinyibin.com,
# before the catch-all `location /` proxy.
location = /gaokao {
    return 308 https://chinese.qinyibin.com/gaokao/;
}

location ^~ /gaokao/ {
    alias /opt/gaokao/current/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
