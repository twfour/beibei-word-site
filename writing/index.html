<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="2026年10月31日初中英语试卷作文：27道原题与PET（CEFR B1）英文写作范例。">
  <meta name="theme-color" content="#173c32">
  <title>初中英语写作练习册 · 贝贝外刊</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <header class="site-header">
    <a class="brand" href="/">BEIBEI <i>/</i> 贝贝外刊</a>
    <span class="edition">WRITING LAB · 31 OCT 2026</span>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="overline">JUNIOR ENGLISH · PET / CEFR B1</p>
        <h1>把每一道作文题，<br><em>写成自己的故事。</em></h1>
        <p class="dek">27 道初中英语写作真题，逐题拆解体裁与任务，配一篇自然、清楚、可模仿的 PET 级范文。</p>
      </div>
      <div class="hero-stamp" aria-label="27道题，PET级别">
        <span>27</span>
        <small>WRITING<br>PROMPTS</small>
      </div>
      <div class="hero-meta">
        <span><b>01</b> 读题</span><span><b>02</b> 搭框架</span><span><b>03</b> 写完整</span>
      </div>
    </section>

    <section class="workbench" aria-label="筛选题目">
      <div class="search-wrap">
        <label for="search">搜索题目</label>
        <input id="search" type="search" placeholder="试试：family / 校园 / 房间" autocomplete="off">
      </div>
      <div class="filters" id="filters" aria-label="按主题筛选"></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <div class="layout">
      <aside class="rail" aria-label="题号导航">
        <p>CONTENTS</p>
        <nav id="question-nav"></nav>
      </aside>
      <section class="question-list" id="question-list" aria-label="写作题与范文"></section>
    </div>

    <section class="closing">
      <p>WRITE · REVISE · GROW</p>
      <h2>好作文不是背出来的，<br>是一次次写清楚的。</h2>
      <a href="#top" id="back-top">回到顶部 ↑</a>
    </section>
  </main>

  <footer>
    <span>BEIBEI WRITING LAB</span>
    <span>Source · 2026年10月31日初中英语试卷作文</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
