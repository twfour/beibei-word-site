server {
    listen 80;
    server_name code.qinyibin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/code-netease/current;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://code.qinyibin.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name code.qinyibin.com;

    ssl_certificate /etc/nginx/ssl/code.qinyibin.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/code.qinyibin.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / { return 308 /netease/; }
    location = /netease { return 308 /netease/; }
    location ^~ /netease/ {
        alias /opt/code-netease/current/;
        index index.html;
        try_files $uri $uri/ /netease/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
